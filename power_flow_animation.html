<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 Detailed Power Flow — Component Level</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0e1a; color: #e0e6f0; min-height: 100vh; overflow-x: hidden; }

  .header {
    background: linear-gradient(135deg, #0f1629, #1a1f3a);
    border-bottom: 2px solid #2a3a5c;
    padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .header h1 { font-size: 1rem; font-weight: 700; background: linear-gradient(90deg, #4fc3f7, #81d4fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header .model { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #7a8bb5; background: #151b30; padding: 4px 10px; border-radius: 6px; border: 1px solid #2a3a5c; }

  .controls {
    display: flex; gap: 6px; align-items: center; padding: 10px 20px;
    background: #0d1220; border-bottom: 1px solid #1a2540; flex-wrap: wrap;
  }
  .controls button { font-family: 'Inter'; font-size: 0.75rem; font-weight: 600; padding: 7px 14px; border: none; border-radius: 7px; cursor: pointer; transition: all 0.2s; }
  .btn-prev { background: #1e2a4a; color: #7a9cc6; }
  .btn-prev:hover { background: #2a3a5c; }
  .btn-next { background: #1565c0; color: #fff; }
  .btn-next:hover { background: #1976d2; }
  .btn-auto { background: #00695c; color: #b2dfdb; }
  .btn-auto.playing { background: #c62828; color: #ffcdd2; }
  .btn-reset { background: #37474f; color: #90a4ae; }
  .stage-ind { font-family: 'JetBrains Mono'; font-size: 0.75rem; color: #4fc3f7; margin-left: auto; background: #0a1025; padding: 5px 12px; border-radius: 6px; border: 1px solid #1a3050; }

  .main { display: flex; height: calc(100vh - 105px); min-height: 650px; }
  .board-container { flex: 1; position: relative; overflow: hidden; background: #080c18; }
  .board-container svg { width: 100%; height: 100%; }

  .info-panel {
    width: 360px; background: #0d1225; border-left: 2px solid #1a2540;
    overflow-y: auto; padding: 16px;
  }
  .info-panel h2 { font-size: 0.95rem; font-weight: 700; color: #4fc3f7; margin-bottom: 6px; }
  .info-panel .stitle { font-size: 0.8rem; color: #81d4fa; margin-bottom: 10px; font-weight: 600; }
  .info-panel .desc { font-size: 0.73rem; line-height: 1.75; color: #b0bec5; margin-bottom: 14px; }
  .info-panel .desc strong { color: #fff; }
  .info-panel .desc em { color: #ffcc80; font-style: normal; }

  .amp-box {
    background: linear-gradient(135deg, #1a0a0a, #2a1010);
    border: 2px solid #c62828; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 12px;
  }
  .amp-box .lbl { font-size: 0.6rem; color: #ef9a9a; text-transform: uppercase; letter-spacing: 1px; }
  .amp-box .val { font-family: 'JetBrains Mono'; font-size: 1.6rem; font-weight: 900; color: #ff5252; margin: 2px 0; }
  .amp-box .unit { font-size: 0.65rem; color: #e57373; }

  .tech {
    background: #111830; border: 1px solid #1a2a4a; border-radius: 8px; padding: 10px;
    margin-bottom: 10px; font-family: 'JetBrains Mono'; font-size: 0.65rem; color: #80cbc4; line-height: 1.8;
  }

  .comp-table {
    width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 0.65rem;
  }
  .comp-table th { background: #1a2040; color: #4fc3f7; padding: 6px 8px; text-align: left; font-weight: 600; border: 1px solid #2a3a5c; }
  .comp-table td { padding: 5px 8px; border: 1px solid #1a2540; color: #b0bec5; }
  .comp-table td:first-child { font-family: 'JetBrains Mono'; color: #ffcc80; font-weight: 600; }

  .tip {
    background: #1a1a00; border-left: 3px solid #ffd600; padding: 8px 10px;
    font-size: 0.68rem; color: #fff9c4; border-radius: 0 6px 6px 0; line-height: 1.5;
  }

  /* SVG */
  .ci { fill: #141e35; stroke: #1e3050; stroke-width: 1; }
  .ci.on { stroke-width: 1.8; }
  .ic { rx: 8; }
  .cap { rx: 2; }
  .res { rx: 2; }
  .ind { rx: 3; }

  .ic.pmic.on { fill: #3e1010; stroke: #f44336; }
  .ic.cpu.on { fill: #0a2040; stroke: #42a5f5; }
  .ic.chg.on { fill: #3e2a00; stroke: #ffb300; }
  .ic.bb.on { fill: #3e0a2a; stroke: #ec407a; }
  .ic.disp.on { fill: #003040; stroke: #00bcd4; }
  .ic.cam.on { fill: #1a1a50; stroke: #7c4dff; }
  .ic.aud.on { fill: #200a3e; stroke: #ba68c8; }
  .ic.wifi.on { fill: #002040; stroke: #03a9f4; }

  .cap.on { fill: #2a1a00; stroke: #ffa726; }
  .res.on { fill: #1a2a1a; stroke: #66bb6a; }
  .ind.on { fill: #0a1a2a; stroke: #29b6f6; }
  .bat.on { fill: #1a3a1a; stroke: #4caf50; }
  .crys.on { fill: #003030; stroke: #26a69a; }
  .shunt.on { fill: #3a0a0a; stroke: #ef5350; }
  .ntc.on { fill: #2a2a00; stroke: #cddc39; }
  .pa.on { fill: #3e1a00; stroke: #ff7043; }
  .saw.on { fill: #2a0a2a; stroke: #ab47bc; }
  .bld.on { fill: #003040; stroke: #00acc1; }

  .ln { stroke: #111a30; stroke-width: 0.8; fill: none; }
  .ln.pwr { stroke: #e53935; stroke-width: 2; }
  .ln.dat { stroke: #1e88e5; stroke-width: 1.5; }
  .ln.clk { stroke: #43a047; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .ln.sig { stroke: #fb8c00; stroke-width: 1.5; }

  @keyframes fp { 0%{stroke-dashoffset:16;} 100%{stroke-dashoffset:0;} }
  .fl { stroke-dasharray: 8 4; animation: fp 0.6s linear infinite; }
  @keyframes gp { 0%,100%{filter:drop-shadow(0 0 2px currentColor);} 50%{filter:drop-shadow(0 0 8px currentColor);} }
  .gw { animation: gp 1.5s ease-in-out infinite; }

  .lt { font-family: 'JetBrains Mono'; font-size: 7px; fill: #506080; text-anchor: middle; pointer-events: none; }
  .lt.on { fill: #cfd8dc; font-weight: 700; }
  .vt { font-family: 'JetBrains Mono'; font-size: 6.5px; fill: #ffd600; text-anchor: middle; display: none; }
  .ct { font-family: 'JetBrains Mono'; font-size: 5.5px; fill: #90a4ae; text-anchor: middle; }
  .ct.on { fill: #ffcc80; }

  .legend {
    position: absolute; bottom: 8px; left: 8px; background: rgba(10,14,26,0.95);
    border: 1px solid #2a3a5c; border-radius: 6px; padding: 6px 10px;
    font-size: 0.58rem; display: flex; gap: 12px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; color: #78909c; }
  .legend-line { width: 16px; height: 3px; border-radius: 1px; }

  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .info-panel { width: 100%; height: 320px; border-left: none; border-top: 2px solid #1a2540; }
  }
</style>
</head>

{id:0, title:"Phone OFF — எல்லாம் Standby",emoji:"🔌",amp:"0.00",
 on:[], lines:[], vtags:[], 
 desc:`Phone OFF. Board-ல் எந்த current-ம் ஓடவில்லை.<br><br>PMIC standby mode — RTC LDO மட்டும் active (time ஓடும்).`,
 tech:`ALL COMPONENTS: OFF\nPMIC: Standby\nRTC: Micro-current only`,
 comps:[],
 tip:`💡 DC Supply connect → 0A → Board alive but sleeping. Power button line or PMIC trigger circuit check பண்ணுங்க.`},

{id:1, title:"Battery → PMIC — VBAT Line Active",emoji:"🔋",amp:"0.001",
 on:['bat','pmic','c_pmic_in1','c_pmic_in2'],
 lines:[{id:'ln_bat_pmic',c:'pwr',f:1}],
 vtags:['v_vbat'],
 desc:`Battery connect → <strong>VBAT line</strong> (3.7-4.2V) → PMIC-க்கு raw power reach.<br><br><em>C101, C102</em> = PMIC input decoupling capacitors. இவை VBAT line-ல் உள்ள noise-ஐ filter பண்ணும். Battery-ல் இருந்து வரும் voltage-ல் ripple/noise இருக்கும் — capacitors அதை smooth பண்ணி clean power கொடுக்கும்.`,
 tech:`VBAT: 3.7-4.2V → PMIC\nC101: 10µF (bulk filter)\nC102: 100nF (high-freq filter)\nPMIC: Standby → Monitoring PWR_KEY`,
 comps:[
  {n:'C101',t:'Capacitor',f:'PMIC input bulk filter — low frequency noise remove'},
  {n:'C102',t:'Capacitor',f:'PMIC input HF filter — high frequency noise remove'},
 ],
 tip:`💡 C101 or C102 short ஆனா → VBAT line short → DC Supply-ல் instant high current. இந்த caps-ஐ remove பண்ணி test பண்ணுங்க.`},

{id:2, title:"Power Button → Crystal ON → 19.2 MHz Clock!",emoji:"⏰",amp:"0.01",
 on:['bat','pmic','c_pmic_in1','c_pmic_in2','crys','c_crys1','c_crys2'],
 lines:[{id:'ln_bat_pmic',c:'pwr',f:1},{id:'ln_crys_pmic',c:'clk',f:1}],
 vtags:['v_vbat'],
 desc:`Power button press → PMIC wake up → <strong>Crystal Oscillator</strong> activate!<br><br>Crystal = 19.2 MHz frequency generate பண்றது. இதுதான் CPU-க்கான <strong>"heartbeat"</strong>.<br><br><em>C501, C502</em> = Crystal load capacitors. Crystal சரியா oscillate ஆக இந்த 2 caps MUST be correct value. ஒன்று damaged ஆனாலும் → frequency wrong → CPU start ஆகாது!`,
 tech:`PWR_KEY: Triggered ✓\nCrystal: 19.2 MHz generating\nC501: ~12pF (load cap 1)\nC502: ~12pF (load cap 2)\nPMIC_RESET_N: Released`,
 comps:[
  {n:'Crystal',t:'Oscillator',f:'19.2 MHz clock — CPU heartbeat'},
  {n:'C501',t:'Capacitor',f:'Crystal load cap — frequency stability'},
  {n:'C502',t:'Capacitor',f:'Crystal load cap — frequency stability'},
 ],
 tip:`💡 Crystal dead / C501,C502 damaged → 0.01A-ல் stuck, CPU start ஆகாது. Crystal-ஐ multimeter-ல் check பண்ண முடியாது — oscilloscope or replacement needed.`},

{id:3, title:"PMIC → Buck Converters → VDD_CX, VDD_MX ON!",emoji:"⚡",amp:"0.05",
 on:['bat','pmic','c_pmic_in1','c_pmic_in2','crys','c_crys1','c_crys2','l_cx','c_cx','l_mx','c_mx','l_gfx','c_gfx'],
 lines:[{id:'ln_bat_pmic',c:'pwr',f:1},{id:'ln_crys_pmic',c:'clk',f:1},{id:'ln_pmic_cx',c:'pwr',f:1},{id:'ln_pmic_mx',c:'pwr',f:1},{id:'ln_pmic_gfx',c:'pwr',f:1}],
 vtags:['v_vbat','v_cx','v_mx','v_gfx'],
 desc:`PMIC-ன் SMPS (Buck Converters) activate! ஒவ்வொரு rail-க்கும் <strong>Inductor + Capacitor</strong> pair இருக்கு.<br><br><strong>எப்படி work ஆகுது?</strong><br>PMIC உள்ளே switch ON/OFF → L101 (inductor) energy store/release → C201 (capacitor) smooth பண்ணும் → Clean steady voltage output!<br><br>இது <em>Buck Converter</em> topology — 3.8V input → 0.9V output efficient-ஆ convert.`,
 tech:`VREG_S1: PMIC → L101 → C201 → VDD_CX = 0.9V\nVREG_S2: PMIC → L102 → C202 → VDD_MX = 0.75V\nVREG_S3: PMIC → L103 → C203 → VDD_GFX = 0.9V\n\nL101: ~0.47µH (buck inductor)\nC201: ~22µF (output filter)\nEfficiency: ~90%`,
 comps:[
  {n:'L101',t:'Inductor',f:'VDD_CX buck output — energy storage coil'},
  {n:'C201',t:'Capacitor',f:'VDD_CX output filter — voltage smooth'},
  {n:'L102',t:'Inductor',f:'VDD_MX buck output coil'},
  {n:'C202',t:'Capacitor',f:'VDD_MX output filter'},
  {n:'L103',t:'Inductor',f:'VDD_GFX buck output coil'},
  {n:'C203',t:'Capacitor',f:'VDD_GFX output filter'},
 ],
 tip:`💡 L101 open (crack) ஆனா → VDD_CX 0V → CPU power இல்லை → 0.05A stuck. C201 short ஆனா → VDD_CX line short → high current. Inductor = beep ஆகணும், Cap = beep ஆக கூடாது.`},

{id:4, title:"CPU ON! Decoupling Capacitors Active",emoji:"🧠",amp:"0.08",
 on:['bat','pmic','c_pmic_in1','c_pmic_in2','crys','c_crys1','c_crys2','l_cx','c_cx','l_mx','c_mx','l_gfx','c_gfx','cpu','c_cpu1','c_cpu2','c_cpu3','c_cpu4','c_cpu5','c_cpu6','c_cpu7'],
 lines:[{id:'ln_bat_pmic',c:'pwr',f:1},{id:'ln_crys_pmic',c:'clk',f:0},{id:'ln_pmic_cx',c:'pwr',f:1},{id:'ln_cx_cpu',c:'pwr',f:1},{id:'ln_pmic_mx',c:'pwr',f:1},{id:'ln_mx_cpu',c:'pwr',f:1}],
 vtags:['v_vbat','v_cx','v_mx'],
 desc:`CPU power rails reach → CPU ON!<br><br>CPU சுற்றிலும் <strong>C601 — C607 (7 decoupling capacitors)</strong> இருக்கு. ஏன்?<br><br>CPU very fast-ஆ switch ஆகும்போது sudden current spikes வரும். Decoupling caps = <em>"local mini batteries"</em> — instant current கொடுத்து voltage stable-ஆ வைக்கும்.<br><br>இவை இல்லாட்டி → voltage drop → CPU crash / hang!`,
 tech:`CPU: PBL Executing from ROM\nC601-C605: 100nF each (top decoupling)\nC606-C607: 10µF each (bulk decoupling)\n\nRole: Instant current supply during\nCPU switching transients`,
 comps:[
  {n:'C601-C605',t:'Capacitors',f:'CPU top-side decoupling — HF noise filter'},
  {n:'C606-C607',t:'Capacitors',f:'CPU bulk decoupling — current reservoir'},
 ],
 tip:`💡 CPU area-ல் capacitor short → VDD_CX/MX line short → high current, CPU area hot. ஒவ்வொரு cap-ஆ remove பண்ணி short find பண்ணுங்க. எந்த cap remove பண்ணினா short போகுதோ — அதுதான் faulty cap!`},

{id:5, title:"CPU ↔ RAM — Memory Initialize",emoji:"📒",amp:"0.15",
 on:['bat','pmic','crys','l_cx','c_cx','l_mx','c_mx','cpu','c_cpu1','c_cpu2','c_cpu3','c_cpu4','c_cpu5','ram','c_ram1','c_ram2'],
 lines:[{id:'ln_bat_pmic',c:'pwr',f:1},{id:'ln_cx_cpu',c:'pwr',f:0},{id:'ln_mx_cpu',c:'pwr',f:0},{id:'ln_cpu_ram',c:'dat',f:1}],

  {n:'C702',t:'Capacitor',f:'RAM VDDQ HF filter'},
 ],

{id:6, title:"CPU → UFS Storage → OS Load!",emoji:"🗄️",amp:"0.25",
 on:['bat','pmic','crys','l_cx','c_cx','l_mx','c_mx','cpu','c_cpu1','c_cpu2','c_cpu3','c_cpu4','c_cpu5','ram','c_ram1','c_ram2','ufs','c_ufs1'],
 lines:[{id:'ln_bat_pmic',c:'pwr',f:1},{id:'ln_cx_cpu',c:'pwr',f:0},{id:'ln_cpu_ram',c:'dat',f:0},{id:'ln_cpu_ufs',c:'dat',f:1}],
 vtags:['v_cx','v_ufs'],
 desc:`CPU → UFS 2.2 Storage → Bootloader + Android OS load!<br><br>UFS = PCIe protocol, very high speed. <em>C801</em> = UFS power filter cap.<br><br>VCC (2.5V) + VCCQ (1.2V) → UFS power rails. இரண்டும் correct-ஆ இருக்கணும்.`,
 tech:`UFS VCC: 2.5V ✓\nUFS VCCQ: 1.2V ✓\nC801: Power filter\nBootloader: Loading...\nAndroid: Mounting partitions...`,
 comps:[{n:'C801',t:'Capacitor',f:'UFS power filter — clean storage power'}],
 tip:`💡 Boot loop = software 70%, UFS 30%. First flash try. Flash fail / QFIL-ல் detect ஆகல → UFS IC faulty.`},

{id:7, title:"PS_HOLD Handshake! 🤝 CPU ↔ PMIC",emoji:"🤝",amp:"0.30",
 on:['bat','pmic','crys','l_cx','c_cx','l_mx','c_mx','cpu','ram','ufs','c_cpu1','c_cpu2','c_cpu3','c_cpu4','c_cpu5'],
 lines:[{id:'ln_bat_pmic',c:'pwr',f:1},{id:'ln_cx_cpu',c:'pwr',f:0},{id:'ln_cpu_ram',c:'dat',f:0},{id:'ln_cpu_ufs',c:'dat',f:0},{id:'ln_pshold',c:'sig',f:1}],
 vtags:['v_pshold'],
 desc:`<strong>🤝 CRITICAL HANDSHAKE!</strong><br><br>CPU bootloader success → <strong>PS_HOLD = HIGH</strong> signal → PMIC-க்கு send.<br><br>Meaning: <em>"நான் alive! Power continue பண்ணு!"</em><br><br>PS_HOLD LOW/missing → PMIC power cut → <strong>Phone blink and die!</strong><br><br>இந்த signal ஒரு <em>single wire</em> — CPU pin → trace → PMIC pin. Trace crack ஆனாலும் same symptom.`,
 tech:`PS_HOLD: HIGH ✓✓✓\nCPU → PMIC: "Keep power ON"\nAll primary rails: Maintained\nBoot: Continuing to Android...`,
 comps:[],
 tip:`💡 Phone blink → OFF (current spike then 0) = PS_HOLD problem. Check: 1) CPU boot fail (software?) 2) PS_HOLD trace broken 3) PMIC PS_HOLD pin issue.`},

{id:8, title:"Baseband + RF + PA + Antenna! 📻",emoji:"📻",amp:"0.40",

{id:9, title:"Display ON! ELVDD + ELVSS + MIPI 📺",emoji:"📺",amp:"0.55",

let cur=0, autoInt=null;

function resetB(){
  document.querySelectorAll('.ci').forEach(e=>{e.classList.remove('on','gw');});
  document.querySelectorAll('.ln').forEach(e=>{e.className.baseVal='ln';});
  document.querySelectorAll('.vt').forEach(e=>{e.style.display='none';});
  document.querySelectorAll('.lt').forEach(e=>{e.classList.remove('on');});
  document.querySelectorAll('.ct').forEach(e=>{e.classList.remove('on');});
  const ant=document.getElementById('ant'); if(ant) ant.style.display='none';
}

function apply(i){
  resetB();
  const s=S[i];
  s.on.forEach(id=>{const e=document.getElementById(id);if(e){e.classList.add('on');}});
  s.lines.forEach(l=>{const e=document.getElementById(l.id);if(e){e.className.baseVal='ln '+l.c+(l.f?' fl':'');}});
  s.vtags.forEach(v=>{const e=document.getElementById(v);if(e)e.style.display='block';});
  if(s.extras) s.extras.forEach(x=>{const e=document.getElementById(x);if(e)e.style.display='block';});

  // Highlight first 2 activated components with glow
  let glowCount=0;
  s.on.forEach(id=>{
    const e=document.getElementById(id);
    if(e && e.classList.contains('ic') && glowCount<2){e.classList.add('gw');glowCount++;}
  });

  // Build info panel
  let compTable='';
  if(s.comps && s.comps.length>0){
    compTable=`<table class="comp-table"><tr><th>Component</th><th>Type</th><th>Function</th></tr>`;
    s.comps.forEach(c=>{compTable+=`<tr><td>${c.n}</td><td>${c.t}</td><td>${c.f}</td></tr>`;});
    compTable+=`</table>`;
  }

  document.getElementById('ip').innerHTML=`
    <h2>${s.emoji} Stage ${s.id}</h2>
    <div class="stitle">${s.title}</div>
    <div class="desc">${s.desc}</div>
    <div class="amp-box"><div class="lbl">DC Supply Reading</div><div class="val">${s.amp}</div><div class="unit">Ampere</div></div>
    <div class="tech">${s.tech.replace(/\n/g,'<br>')}</div>
    ${compTable}
    <div class="tip">${s.tip}</div>
  `;
  document.getElementById('si').textContent=`Stage ${s.id} / ${S.length-1}`;
}

function next(){if(cur<S.length-1){cur++;apply(cur);}}
function prev(){if(cur>0){cur--;apply(cur);}}
function reset(){stopA();cur=0;apply(0);}
function toggleAuto(){
  const b=document.getElementById('ab');
  if(autoInt){stopA();}
  else{b.textContent='⏸ Stop';b.classList.add('playing');autoInt=setInterval(()=>{if(cur<S.length-1){cur++;apply(cur);}else stopA();},3500);}
}
function stopA(){const b=document.getElementById('ab');clearInterval(autoInt);autoInt=null;b.textContent='▶ Auto';b.classList.remove('playing');}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  if(e.key==='r')reset();
});

apply(0);
</script>
